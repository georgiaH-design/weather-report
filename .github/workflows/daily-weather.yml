name: Daily Maritime Weather Report

on:
  schedule:
    # Four reports a day: 07:00, 13:00, 19:00 and 01:00 UTC.
    # Scheduled 8 minutes early and off the hour, because GitHub delays
    # (and sometimes drops) jobs queued at the top of the hour.
    - cron: '52 6 * * *'    # 07:00 UTC report
    - cron: '52 12 * * *'   # 13:00 UTC report
    - cron: '52 18 * * *'   # 19:00 UTC report
    - cron: '52 0 * * *'    # 01:00 UTC report
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate weather report
        run: python generate_weather.py

      - name: Commit and push updated report
        run: |
          git config user.name "Captain Georgia Weather Bot"
          git config user.email "actions@github.com"
          git pull origin main
          git add index.html
          git diff --staged --quiet || git commit -m "Daily weather report — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

